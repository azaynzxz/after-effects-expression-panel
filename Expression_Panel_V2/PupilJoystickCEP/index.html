<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Pupil Joystick</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="content">
        <div class="row">
            <label>Property:</label>
            <input type="text" id="propName" value="pupil-ctrl Position" />
        </div>
        <div class="row">
            <label>Range (Max):</label>
            <input type="number" id="joyRange" value="100" />

            <label class="check-label">
                <input type="checkbox" id="chkMirrored" /> Mirrored
            </label>
        </div>

        <div class="row labels-only">
            <span>X: <span id="valX">0</span></span>
            <span>Y: <span id="valY">0</span></span>
        </div>

        <div id="pad-container">
            <div id="pad">
                <div id="crosshair-x"></div>
                <div id="crosshair-y"></div>
                <div id="knob"></div>
            </div>
        </div>

        <button id="btnReset">Reset to 0, 0</button>
    </div>

    <!-- Adobe CSInterface script -->
    <script src="js/CSInterface.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
